version: '3.8'

services:
  todo-app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: todo-app-container
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    volumes:
      - ./src:/usr/share/nginx/html:ro

networks:
  todo-network:
    driver: bridge
