version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: dockerfile
    container_name: to-do-app
    ports:
      - "8080:80"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  app-network:
    driver: bridge